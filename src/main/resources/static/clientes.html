
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>Cadastro de Clientes</h1>

        <p>
            <a href="/">Voltar para produtos</a>
        </p>

        <form id="clienteForm">

            <input type="hidden" id="id">

            <label for="nome">Nome</label>
            <input type="text" id="nome" maxlength="150" required>

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" maxlength="14" required>

            <label for="idade">Idade</label>
            <input type="number" id="idade" min="0" required>

            <label for="profissao">Profissão</label>
            <input type="text" id="profissao" maxlength="100">

            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" maxlength="255">

            <div class="botoes">
                <button type="submit" id="btnSalvar">
                    Cadastrar
                </button>

                <button type="button" id="btnCancelar"
                        class="secundario" hidden>
                    Cancelar edição
                </button>
            </div>

        </form>

        <p id="mensagem" role="status"></p>

        <h2>Clientes cadastrados</h2>

        <div class="tabela-container">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Idade</th>
                        <th>Profissão</th>
                        <th>Endereço</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaClientes"></tbody>
            </table>

        </div>

    </main>

    <script src="clientes.js"></script>

</body>
</html>
