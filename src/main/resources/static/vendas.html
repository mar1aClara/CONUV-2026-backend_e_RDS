
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Vendas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Cadastro de Vendas</h1>

        <form id="formVenda">

            <input type="hidden" id="id">

            <label for="data">Data da venda:</label>
            <input type="date" id="data" required>

            <label for="loja">Loja:</label>
            <input type="text" id="loja" required>

            <label for="cliente">Cliente:</label>
            <select id="cliente" required>
                <option value="">Selecione um cliente</option>
            </select>

            <label for="produto">Produto:</label>
            <select id="produto" required>
                <option value="">Selecione um produto</option>
            </select>

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" min="1" required>

            <button type="submit" id="btnSalvar">Cadastrar venda</button>
            <button type="button" id="btnCancelar" onclick="limparFormulario()">Cancelar</button>

        </form>

        <h2>Vendas cadastradas</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Data</th>
                    <th>Loja</th>
                    <th>Cliente</th>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Valor total</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="tabelaVendas"></tbody>
        </table>

        <br>
        <a href="index.html">Voltar ao início</a>

    </div>

    <script src="vendas.js"></script>

</body>
</html>
